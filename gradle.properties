# kuikly-app-icon 构建配置
# kuiklyVersion：Kuikly 模板的 Kotlin 版本（与 KuiklyUI 模板工程 build.<版本>.gradle.kts 对应）
kuiklyVersion=2.0.21
# kuiklyCoreVersion：Maven 上发布的 Kuikly 产物版本（复合格式 Kuikly版本-Kotlin版本，
# 见 https://mirrors.tencent.com/repository/maven-tencent/com/tencent/kuikly-open/core/ ）
kuiklyCoreVersion=2.30.0-2.0.21

# 发布坐标（io.github.zhanghaifei1997 为本人 Maven Central group，见 docs/PUBLISH.md）
kuiklyAppIcon.group=io.github.zhanghaifei1997
kuiklyAppIcon.version=0.1.0
